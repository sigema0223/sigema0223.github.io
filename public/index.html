  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
  <script>
	const darkPref = window.matchMedia("(prefers-color-scheme: dark)");
	if(darkPref.matches && localStorage.getItem('mode') !== "Light")
      localStorage.setItem('mode', 'Dark')
  </script>
  <script>
    const fun = () => {
    if(localStorage.getItem('mode') === 'Dark'){
      document.getElementById('mode-switch').checked = true;
      document.documentElement.classList.toggle('dark-mode')
      document.getElementById('not-dark').classList.toggle('inverse-dark')
      
      // 이스터 에그의 눈 이펙트는 제외 (quotes-particles 클래스가 있으면 제외)
      const notDark2 = document.getElementById('not-dark2');
      if (notDark2 && !notDark2.classList.contains('quotes-particles')) {
        notDark2.classList.toggle('inverse-dark');
      }
      
      var x = document.getElementsByClassName('img-pro')
      for(let i = 0; i < x.length; i += 1) {
        x.item(i).classList.toggle("inverse-dark");
      }
      
      // AboutMe 이미지 필터 제거
      const aboutMeImage = document.getElementById('about-me-image');
      const aboutMeImageWrapper = document.getElementById('about-me-image-not-dark');
      if (aboutMeImage) {
        aboutMeImage.style.filter = 'none';
        aboutMeImage.style.webkitFilter = 'none';
        aboutMeImage.style.mozFilter = 'none';
      }
      if (aboutMeImageWrapper) {
        aboutMeImageWrapper.style.filter = 'none';
        aboutMeImageWrapper.style.webkitFilter = 'none';
        aboutMeImageWrapper.style.mozFilter = 'none';
      }
    }
    }
    fun();
    
    // 페이지 로드 후에도 이미지 필터 제거
    window.addEventListener('load', () => {
      const aboutMeImage = document.getElementById('about-me-image');
      const aboutMeImageWrapper = document.getElementById('about-me-image-not-dark');
      if (aboutMeImage) {
        aboutMeImage.style.filter = 'none';
        aboutMeImage.style.webkitFilter = 'none';
        aboutMeImage.style.mozFilter = 'none';
      }
      if (aboutMeImageWrapper) {
        aboutMeImageWrapper.style.filter = 'none';
        aboutMeImageWrapper.style.webkitFilter = 'none';
        aboutMeImageWrapper.style.mozFilter = 'none';
      }
    });
  </script>
</html>
